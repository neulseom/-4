
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코인타워 | 내 돈의 높이</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Malgun Gothic", Arial, sans-serif;
  background: #f4f5f7;
  color: #222;
}

header {
  background: white;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  color: #777;
  font-size: 13px;
}

main {
  max-width: 850px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 18px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px #00000008;
}

h2 { margin-top: 0; }

.input-row {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 18px;
  outline: none;
}

input:focus { border-color: #777; }

button {
  padding: 14px 22px;
  background: #333;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

button:hover { background: #555; }

.quick-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.quick-buttons button {
  background: #eee;
  color: #333;
  padding: 10px 15px;
}

.quick-buttons button:hover {
  background: #ddd;
}

#error {
  color: #c0392b;
  font-size: 13px;
  min-height: 18px;
  margin-top: 10px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}

.stat {
  background: #f5f5f5;
  border-radius: 12px;
  padding: 18px 10px;
  text-align: center;
}

.stat small {
  display: block;
  color: #777;
  margin-bottom: 8px;
}

.stat strong {
  font-size: 20px;
  overflow-wrap: anywhere;
}

.message {
  background: #f3f3f3;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-size: 15px;
  margin-bottom: 15px;
}

/* 동전탑 영역 */
.tower-view {
  position: relative;
  height: 440px;
  overflow-y: auto;
  overflow-x: hidden;
  background:
    linear-gradient(#f9f9f9, #ededed);
  border: 2px solid #e4e4e4;
  border-radius: 15px;
  scrollbar-color: #aaa #eee;
}

.tower-world {
  position: relative;
  min-height: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding: 35px 0 25px;
}

.coin-stack {
  position: relative;
  width: 170px;
  flex-shrink: 0;
}

.coin {
  position: absolute;
  width: 170px;
  height: 13px;
  border-radius: 50%;
  background: linear-gradient(
    90deg,
    #777 0%,
    #d4d4d4 18%,
    #f4f4f4 45%,
    #aaa 78%,
    #666 100%
  );
  border: 1px solid #777;
  box-shadow:
    0 2px 0 #777,
    0 3px 2px #999;
}

.coin.top {
  height: 36px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse at 40% 35%,
    #f9f9f9,
    #c7c7c7 55%,
    #777
  );
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-size: 17px;
  font-weight: bold;
}

.ground {
  position: absolute;
  bottom: 13px;
  left: 10%;
  width: 80%;
  height: 12px;
  background: #bbb;
  border-radius: 50%;
  filter: blur(5px);
}

.tower-guide {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-top: 12px;
}

.progress {
  height: 10px;
  background: #e8e8e8;
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #555;
  transition: width .5s;
}

footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: #999;
}

@media (max-width: 600px) {
  .card { padding: 18px; }
  .input-row { flex-direction: column; }
  .stats { gap: 6px; }
  .stat { padding: 12px 5px; }
  .stat strong { font-size: 15px; }
  .tower-view { height: 390px; }
}
</style>
</head>

<body>

<header>
  <h1>COIN TOWER</h1>
  <p>내 돈을 높이로 확인하는 저축 시뮬레이터</p>
</header>

<main>

<section class="card">
  <h2>💰 저축하기</h2>
  <p>내 잔액을 입력하고 동전탑을 쌓아보세요.</p>

  <div class="input-row">
    <input
      id="money"
      type="number"
      min="0"
      max="100000000"
      step="1"
      placeholder="내 잔액 입력 (원)"
    >
    <button onclick="calculate()">결과 보기</button>
  </div>

  <div class="quick-buttons">
    <button onclick="addMoney(1000)">+1,000원</button>
    <button onclick="addMoney(5000)">+5,000원</button>
    <button onclick="addMoney(10000)">+10,000원</button>
    <button onclick="resetMoney()">초기화</button>
  </div>

  <div id="error" role="alert"></div>
</section>

<section class="card">

  <h2>🪙 나의 동전탑</h2>

  <div class="stats">
    <div class="stat">
      <small>내 잔액</small>
      <strong id="totalMoney">0원</strong>
    </div>
    <div class="stat">
      <small>100원 동전</small>
      <strong id="coinCount">0개</strong>
    </div>
    <div class="stat">
      <small>동전탑 높이</small>
      <strong id="towerHeight">0cm</strong>
    </div>
  </div>

  <div class="message" id="message">
    잔액을 입력하면 동전탑이 나타납니다!
  </div>

  <div class="tower-view" id="towerView">
    <div class="tower-world" id="towerWorld">
      <div class="ground"></div>
      <div class="coin-stack" id="coinStack"></div>
    </div>
  </div>

  <div class="tower-guide">
    ↑ 마우스 휠이나 터치로 동전탑을 위아래로 탐험하세요
  </div>

</section>

<section class="card">
  <h2>🎯 다음 목표</h2>
  <p id="goalText">목표를 확인해 보세요.</p>

  <div class="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <p id="progressText"
     style="text-align:right;color:#777;font-size:13px">
    0%
  </p>
</section>

</main>

<footer>
  COIN TOWER · 100원 동전 두께 약 1.5mm 기준
</footer>

<script>
const moneyInput = document.getElementById("money");
const error = document.getElementById("error");
const stack = document.getElementById("coinStack");
const world = document.getElementById("towerWorld");
const view = document.getElementById("towerView");

const format = n => n.toLocaleString("ko-KR");

// 100원 동전 1개 = 1.5mm = 0.15cm
const COIN_HEIGHT_CM = 0.15;

// 화면에서 동전 1개의 쌓이는 간격
const PIXELS_PER_COIN = 3;

// 너무 많은 DOM 요소 생성을 방지
const MAX_RENDERED_COINS = 1200;

function addMoney(amount) {
  const current = Number(moneyInput.value) || 0;
  moneyInput.value = current + amount;
  calculate();
}

function resetMoney() {
  moneyInput.value = "";
  calculate();
}

function calculate() {
  error.textContent = "";

  const raw = moneyInput.value.trim();
  const money = raw === "" ? 0 : Number(raw);

  if (
    !Number.isFinite(money) ||
    money < 0 ||
    !Number.isInteger(money) ||
    money > 100000000
  ) {
    error.textContent =
      "0원부터 1억 원까지 정수로 입력해 주세요.";
    return;
  }

  // 실제로 교환 가능한 100원 동전 개수
  const count = Math.floor(money / 100);
  const remainder = money % 100;

  const height = count * COIN_HEIGHT_CM;

  document.getElementById("totalMoney").textContent =
    format(money) + "원";

  document.getElementById("coinCount").textContent =
    format(count) + "개";

  document.getElementById("towerHeight").textContent =
    format(Number(height.toFixed(2))) + "cm";

  // 이전 동전 제거
  stack.replaceChildren();

  // 모든 동전을 표시하면 브라우저가 느려질 수 있으므로
  // 큰 금액은 압축된 시각화로 표현
  const visibleCount = Math.min(count, MAX_RENDERED_COINS);

  const visualHeight = visibleCount * PIXELS_PER_COIN;

  stack.style.height = count === 0
    ? "0px"
    : (visualHeight + 36) + "px";

  const fragment = document.createDocumentFragment();

  for (let i = 0; i < visibleCount; i++) {
    const coin = document.createElement("div");
    coin.className = "coin";
    coin.style.bottom = (i * PIXELS_PER_COIN) + "px";
    fragment.appendChild(coin);
  }

  if (count > 0) {
    const top = document.createElement("div");
    top.className = "coin top";
    top.style.bottom = (visibleCount * PIXELS_PER_COIN) + "px";
    top.textContent = "100";
    fragment.appendChild(top);
  }

  stack.appendChild(fragment);

  // 탑 전체 높이에 맞게 스크롤 영역 설정
  world.style.height = Math.max(
    440,
    visualHeight + 100
  ) + "px";

  // 결과를 누르면 동전탑의 꼭대기로 이동
  view.scrollTop = 0;

  let message = "";

  if (count === 0) {
    message = "100원부터 동전탑을 쌓을 수 있어요!";
  } else if (height < 10) {
    message = "작은 동전탑도 저축의 시작이에요!";
  } else if (height < 30) {
    message = "동전탑이 자라고 있어요!";
  } else if (height < 100) {
    message = "제법 높은 동전탑이 되었어요!";
  } else if (height < 150) {
    message = "동전탑이 1m를 넘었어요!";
  } else if (height < 200) {
    message =
      "초등학교 고학년 학생의 키와 비슷한 높이예요!";
  } else {
    message = "와! 동전탑이 사람 키보다 높아졌어요!";
  }

  if (remainder > 0) {
    message +=
      " (남은 " + remainder + "원은 동전으로 바꾸지 않았어요.)";
  }

  if (count > MAX_RENDERED_COINS) {
    message +=
      " 화면에서는 동전 일부를 압축해서 표시해요.";
  }

  document.getElementById("message").textContent = message;

  // 다음 목표: 50cm 단위
  const nextGoal =
    (Math.floor(height / 50) + 1) * 50;

  const neededCoins =
    Math.ceil((nextGoal - height) / COIN_HEIGHT_CM);

  const neededMoney = neededCoins * 100;

  document.getElementById("goalText").textContent =
    "다음 목표 " + nextGoal +
    "cm까지 약 " + format(neededMoney) +
    "원 더 모으면 돼요!";

  const progress = (height % 50) / 50 * 100;

  document.getElementById("progressFill").style.width =
    progress + "%";

  document.getElementById("progressText").textContent =
    progress.toFixed(1) + "% 달성";

  // 잔액 자동 저장
  localStorage.setItem("coinTowerMoney", String(money));
}

// 엔터키로 결과 보기
moneyInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") calculate();
});

// 저장된 금액 복원
const saved = localStorage.getItem("coinTowerMoney");

if (saved !== null) {
  moneyInput.value = saved;
}

calculate();
</script>

</body>
</html>
